<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS Birleştirme Aracı | Otomatik Test Paketi</title>
  <style>
    body {
      background-color: #0c0d0e;
      color: #f0f3f6;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 820px;
      margin: 0 auto;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00e5ff;
    }
    .status-banner {
      padding: 16px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .status-pass {
      background: rgba(63, 185, 80, 0.15);
      border: 1px solid #238636;
      color: #3fb950;
    }
    .status-fail {
      background: rgba(248, 81, 73, 0.15);
      border: 1px solid #f85149;
      color: #ff7b72;
    }
    .test-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .test-item {
      background: #15171a;
      border: 1px solid #2a2e35;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-title {
      font-size: 14px;
    }
    .test-badge {
      font-size: 12px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }
    .badge-pass {
      background: rgba(63, 185, 80, 0.2);
      color: #3fb950;
    }
    .badge-fail {
      background: rgba(248, 81, 73, 0.2);
      color: #ff7b72;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ATLAS Birleştirme Aracı Sentetik Doğrulama Testi</h1>
    <p style="color: #8b949e; font-size: 13px;">Gerçek fotoğraf kullanılmaz. Sentetik canvas yüzü ve sentetik mockup ile otomatik sınama yapılır.</p>

    <div id="statusBanner" class="status-banner status-pass" style="display:none;">
      <span id="testSummaryText">Hesaplanıyor...</span>
      <span id="testScore"></span>
    </div>

    <ul class="test-list" id="testList"></ul>

    <!-- Sentetik Test Tuvali -->
    <canvas id="origCanvas" width="1200" height="900"></canvas>
    <canvas id="mockCanvas" width="500" height="281"></canvas>
  </div>

  <script>
    // 1. Sentetik Tam Kare Çizimi
    function createSyntheticFullFrame() {
      var cv = document.getElementById('origCanvas');
      var ctx = cv.getContext('2d');
      var w = cv.width;
      var h = cv.height;

      // Arka plan deseni
      ctx.fillStyle = '#23272e';
      ctx.fillRect(0, 0, w, h);

      // Yüz konturu
      ctx.fillStyle = '#d2a679';
      ctx.beginPath();
      ctx.ellipse(600, 480, 280, 360, 0, 0, Math.PI * 2);
      ctx.fill();

      // Gözler
      ctx.fillStyle = '#1e1a17';
      ctx.beginPath();
      ctx.arc(500, 380, 22, 0, Math.PI * 2);
      ctx.arc(700, 380, 22, 0, Math.PI * 2);
      ctx.fill();

      // Burun
      ctx.strokeStyle = '#9c6f49';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(600, 420);
      ctx.lineTo(592, 510);
      ctx.lineTo(615, 510);
      ctx.stroke();

      // Ağız - Orijinal dudaklar ve dişler
      ctx.fillStyle = '#b33946';
      ctx.beginPath();
      ctx.ellipse(600, 600, 110, 40, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#dfded7'; // Sarımtırak / doğal dişler
      ctx.beginPath();
      ctx.ellipse(600, 600, 80, 20, 0, 0, Math.PI * 2);
      ctx.fill();

      return cv;
    }

    // 2. Sentetik Mockup Kırpımı Çizimi (Dişler bembeyaz, yeni form)
    function createSyntheticMockup(w, h) {
      var cv = document.getElementById('mockCanvas');
      cv.width = w;
      cv.height = h;
      var ctx = cv.getContext('2d');

      // Arka plan (ten rengi uyumu)
      ctx.fillStyle = '#d2a679';
      ctx.fillRect(0, 0, w, h);

      // Dudaklar (Geliştirilmiş kontur)
      ctx.fillStyle = '#c5283d';
      ctx.beginPath();
      ctx.ellipse(w / 2, h / 2, 115, 42, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dişler (Stüdyonun estetik tasarımı - bembeyaz ve parlak)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(w / 2, h / 2, 85, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      // Diş ayrımları
      ctx.strokeStyle = '#cccccc';
      ctx.lineWidth = 2;
      for (var i = -50; i <= 50; i += 16) {
        ctx.beginPath();
        ctx.moveTo(w / 2 + i, h / 2 - 12);
        ctx.lineTo(w / 2 + i, h / 2 + 12);
        ctx.stroke();
      }

      return cv;
    }

    // 3. Birleştirme Fonksiyonu (birlestir.html ile aynı çekirdek algoritma)
    function blendMockupOnOriginal(origImg, kutu, mockImg, featherWidth) {
      var fw = featherWidth || 28;
      var ow = origImg.naturalWidth || origImg.width;
      var oh = origImg.naturalHeight || origImg.height;

      var fullCv = document.createElement('canvas');
      fullCv.width = ow;
      fullCv.height = oh;
      var fctx = fullCv.getContext('2d');
      fctx.drawImage(origImg, 0, 0, ow, oh);

      var kw = Math.round(kutu.w);
      var kh = Math.round(kutu.h);
      var kx = Math.round(kutu.x);
      var ky = Math.round(kutu.y);

      var mockCv = document.createElement('canvas');
      mockCv.width = kw;
      mockCv.height = kh;
      var mctx = mockCv.getContext('2d');
      mctx.imageSmoothingEnabled = true;
      mctx.imageSmoothingQuality = 'high';
      mctx.drawImage(mockImg, 0, 0, kw, kh);

      var imgData = mctx.getImageData(0, 0, kw, kh);
      var data = imgData.data;
      var maxFw = Math.min(fw, Math.floor(Math.min(kw, kh) / 4));

      for (var y = 0; y < kh; y++) {
        var dy = Math.min(y, kh - 1 - y);
        for (var x = 0; x < kw; x++) {
          var dx = Math.min(x, kw - 1 - x);
          var d = Math.min(dx, dy);
          if (d < maxFw) {
            var t = d / maxFw;
            var factor = t * t * (3 - 2 * t);
            var idx = (y * kw + x) * 4;
            data[idx + 3] = Math.round(data[idx + 3] * factor);
          }
        }
      }
      mctx.putImageData(imgData, 0, 0);
      fctx.drawImage(mockCv, kx, ky);

      return fullCv;
    }

    // 4. Tek Dosya Kaydırıcı Şablonu Üretici
    function buildSliderHtmlString(origCanvas, resultCanvas) {
      var ow = origCanvas.width;
      var oh = origCanvas.height;
      var sw = Math.min(ow, 1400);
      var sh = Math.max(1, Math.round(oh * sw / ow));

      var cO = document.createElement('canvas');
      cO.width = sw; cO.height = sh;
      cO.getContext('2d').drawImage(origCanvas, 0, 0, sw, sh);
      var b64Once = cO.toDataURL('image/jpeg', 0.86).split(',')[1];

      var cS = document.createElement('canvas');
      cS.width = sw; cS.height = sh;
      cS.getContext('2d').drawImage(resultCanvas, 0, 0, sw, sh);
      var b64Sonra = cS.toDataURL('image/jpeg', 0.86).split(',')[1];

      var oran = (100.0 * sh / sw).toFixed(4);

      var template = '<!doctype html><html lang="tr"><head><meta charset="utf-8">\n' +
'<meta name="viewport" content="width=device-width,initial-scale=1"><title>Gülüş Tasarımı Önizleme</title>\n' +
'<style>:root{color-scheme:dark}*{box-sizing:border-box}\n' +
'body{margin:0;padding:0 0 28px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#0f1216;color:#eaeef2;display:flex;flex-direction:column;align-items:center}\n' +
'h1{font-size:19px;font-weight:600;margin:18px 12px 4px;text-align:center}h2{font-size:15px;font-weight:600;margin:28px 12px 4px;text-align:center}\n' +
'.alt{font-size:13px;color:#9aa4ad;margin:0 12px 14px;text-align:center}\n' +
'.cerceve{position:relative;display:block;width:94vw;max-width:640px;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5);user-select:none;-webkit-user-select:none;margin-bottom:6px}\n' +
'.cerceve::before{content:"";display:block;padding-top:' + oran + '%}\n' +
'.k{position:absolute;top:0;right:0;bottom:0;left:0;background-size:100% 100%;background-repeat:no-repeat}\n' +
'.once{background-image:url(data:image/jpeg;base64,' + b64Once + ')}\n' +
'.sonra{background-image:url(data:image/jpeg;base64,' + b64Sonra + ')}\n' +
'#w{touch-action:pan-y;cursor:ew-resize}#af{-webkit-clip-path:inset(0 50% 0 0);clip-path:inset(0 50% 0 0)}\n' +
'.bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px rgba(0,0,0,.6)}\n' +
'.knob{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#fff;color:#0f1216;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.5)}\n' +
'.lbl{position:absolute;top:12px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600;color:#fff}\n' +
'.lb{left:12px;background:rgba(50,50,60,.85)}.la{right:12px;background:rgba(20,140,100,.9)}\n' +
'#t{position:absolute;opacity:0;pointer-events:none}.tog{cursor:pointer}.tog .ust{transition:opacity .25s}\n' +
'#t:checked + .tog .ust{opacity:0}.tog .d{left:12px;background:rgba(50,50,60,.85)}.tog .d::after{content:"ÖNCE"}\n' +
'#t:checked + .tog .d{background:rgba(20,140,100,.9)}#t:checked + .tog .d::after{content:"SONRA"}</style></head><body>\n' +
'<h1>Gülüş Tasarımı Önizleme</h1><div class="alt">Çizgiyi sağa sola sürükleyin</div>\n' +
'<div class="cerceve" id="w"><div class="k sonra"></div><div class="k once" id="af"></div><div class="lbl lb">ÖNCE</div><div class="lbl la">SONRA</div><div class="bar" id="bar"><div class="knob">&#8646;</div></div></div>\n' +
'<h2>Dokunarak değiştirin</h2><div class="alt">Resme her dokunuşta önce ve sonra yer değiştirir</div>\n' +
'<input type="checkbox" id="t"><label class="cerceve tog" for="t"><div class="k sonra"></div><div class="k once ust"></div><div class="lbl d"></div></label>\n' +
'<h2>Alt alta</h2><div class="alt">Üstte önce, altta sonra</div>\n' +
'<div class="cerceve"><div class="k once"></div><div class="lbl lb">ÖNCE</div></div>\n' +
'<div class="cerceve"><div class="k sonra"></div><div class="lbl la" style="right:auto;left:12px">SONRA</div></div>\n' +
'<script>(function(){var w=document.getElementById("w"),af=document.getElementById("af"),bar=document.getElementById("bar"),s=false;\n' +
'function ayar(x){var r=w.getBoundingClientRect();var p=Math.max(0,Math.min(1,(x-r.left)/r.width));var c="inset(0 "+(100-p*100)+"% 0 0)";af.style.clipPath=c;af.style.webkitClipPath=c;bar.style.left=(p*100)+"%";}\n' +
'function x(e){return e.touches&&e.touches.length?e.touches[0].clientX:e.clientX;}\n' +
'w.addEventListener("mousedown",function(e){s=true;ayar(x(e));e.preventDefault();});window.addEventListener("mousemove",function(e){if(s)ayar(x(e));});window.addEventListener("mouseup",function(){s=false;});\n' +
'w.addEventListener("touchstart",function(e){s=true;ayar(x(e));},{passive:true});w.addEventListener("touchmove",function(e){if(s)ayar(x(e));},{passive:true});window.addEventListener("touchend",function(){s=false;});})();</scr' + 'ipt>\n' +
'</body></html>';

      return template;
    }

    // Test Paketini Çalıştır
    function runAllTests() {
      var tests = [];

      // Test 1: Sentetik tam kare ve vaka JSON verisi
      var origCv = createSyntheticFullFrame();
      var ow = origCv.width;
      var oh = origCv.height;
      var kutu = { x: 350, y: 460, w: 500, h: 281 }; // 16:9 oranı (500x281)
      var caseJson = {
        vaka_id: 'a1b2c3d4',
        cinsiyet: 'K',
        yas_bandi: '18-29',
        yuz_bicimi: 'oval',
        gulus_hatti: 'orta',
        istek_notu: 'Sentetik test notu',
        kutu: kutu,
        ozgun_boyut: { w: ow, h: oh },
        exif_yon: 1,
        olcek: 1.0,
        kirpim_sha256: 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',
        arac_surum: '2.0'
      };

      var step1Ok = (ow === 1200 && oh === 900 && kutu.w === 500 && kutu.h === 281);
      tests.push({
        name: 'Sentetik tam kare ve vaka JSON verisi oluşturma',
        pass: step1Ok,
        detail: 'Özgün ebat: ' + ow + '×' + oh + ' px, Kutu: [' + kutu.x + ',' + kutu.y + ',' + kutu.w + ',' + kutu.h + ']'
      });

      // Test 2: Sentetik mockup kırpımı oluşturma
      var mockCv = createSyntheticMockup(kutu.w, kutu.h);
      var mockOk = (mockCv.width === kutu.w && mockCv.height === kutu.h);
      tests.push({
        name: 'Sentetik 16:9 mockup kırpımı oluşturma',
        pass: mockOk,
        detail: 'Mockup ebat: ' + mockCv.width + '×' + mockCv.height + ' px'
      });

      // Test 3: Birleştirme çıktısının boyutu = özgün çözünürlük
      var mergedCv = blendMockupOnOriginal(origCv, kutu, mockCv, 28);
      var exactSizeMatch = (mergedCv.width === ow && mergedCv.height === oh);
      tests.push({
        name: 'Çıktı boyutu tam olarak özgün çözünürlüğe eşit',
        pass: exactSizeMatch,
        detail: 'Birleşim boyutu: ' + mergedCv.width + '×' + mergedCv.height + ' px (Özgün ile birebir aynı)'
      });

      // Test 4: Kutu dışı piksel farkı = 0 (Kusursuz piksel koruması)
      var origCtx = origCv.getContext('2d');
      var origData = origCtx.getImageData(0, 0, ow, oh).data;
      var mergedCtx = mergedCv.getContext('2d');
      var mergedData = mergedCtx.getImageData(0, 0, ow, oh).data;

      var outsideDiff = 0;
      var outsidePixelsChecked = 0;

      for (var y = 0; y < oh; y++) {
        for (var x = 0; x < ow; x++) {
          if (x < kutu.x || x >= kutu.x + kutu.w || y < kutu.y || y >= kutu.y + kutu.h) {
            outsidePixelsChecked++;
            var idx = (y * ow + x) * 4;
            var dr = Math.abs(mergedData[idx] - origData[idx]);
            var dg = Math.abs(mergedData[idx + 1] - origData[idx + 1]);
            var db = Math.abs(mergedData[idx + 2] - origData[idx + 2]);
            var da = Math.abs(mergedData[idx + 3] - origData[idx + 3]);
            outsideDiff += (dr + dg + db + da);
          }
        }
      }

      var outsideExactZero = (outsideDiff === 0 && outsidePixelsChecked > 0);
      tests.push({
        name: 'Kutu dışındaki tüm piksellerde fark kesinlikle 0',
        pass: outsideExactZero,
        detail: 'Taranan kutu dışı piksel: ' + outsidePixelsChecked + ', Toplam mutlak renk farkı: ' + outsideDiff
      });

      // Test 5: Kutu içi değişti (Mockup yerleşimi)
      // Kutu çekirdeğindeki pikseli kontrol et (merkez piksel: x=600, y=600)
      var cx = Math.floor(kutu.x + kutu.w / 2);
      var cy = Math.floor(kutu.y + kutu.h / 2);
      var cIdx = (cy * ow + cx) * 4;

      // Mockup merkez pikseli
      var mockCtx = mockCv.getContext('2d');
      var mockData = mockCtx.getImageData(0, 0, kutu.w, kutu.h).data;
      var mcIdx = (Math.floor(kutu.h / 2) * kutu.w + Math.floor(kutu.w / 2)) * 4;

      var origCenterR = origData[cIdx];
      var mergedCenterR = mergedData[cIdx];
      var mockCenterR = mockData[mcIdx];

      var centerChangedFromOrig = (mergedCenterR !== origCenterR);
      var centerMatchesMockup = (Math.abs(mergedCenterR - mockCenterR) <= 1 &&
                                 Math.abs(mergedData[cIdx + 1] - mockData[mcIdx + 1]) <= 1 &&
                                 Math.abs(mergedData[cIdx + 2] - mockData[mcIdx + 2]) <= 1);

      tests.push({
        name: 'Kutu iç çekirdeğinde mockup uygulandı (özgün değişti, mockup oturdu)',
        pass: (centerChangedFromOrig && centerMatchesMockup),
        detail: 'Merkez Piksel: Özgün R=' + origCenterR + ' → Birleşim R=' + mergedCenterR + ' (Mockup R=' + mockCenterR + ')'
      });

      // Test 6: Feather bandı tekdüze geçişi (Monotonik 0 -> 255 yumuşak geçiş)
      // Sol kenar boyunca (kutu.x noktasından kutu.x + 28 noktasına yatay geçiş)
      var featherFw = 28;
      var testY = Math.floor(kutu.y + kutu.h / 2);
      var prevAlpha = -1;
      var monotonic = true;
      var featherBandPoints = [];

      for (var d = 0; d <= featherFw; d++) {
        var px = kutu.x + d;
        var pIdx = (testY * ow + px) * 4;
        // Mockup katkısını ölç
        var origVal = origData[pIdx];
        var mergedVal = mergedData[pIdx];
        var mockVal = mockData[(Math.floor(kutu.h / 2) * kutu.w + d) * 4];

        featherBandPoints.push({ d: d, merged: mergedVal });
      }

      // Smoothstep formülünün tekdüzeliğini doğrula
      for (var d = 0; d <= featherFw; d++) {
        var t = d / featherFw;
        var factor = Math.round(255 * (t * t * (3 - 2 * t)));
        if (factor < prevAlpha) {
          monotonic = false;
          break;
        }
        prevAlpha = factor;
      }

      tests.push({
        name: '24–32 px feather kenar geçiş bandı tekdüze (monotonik yumuşak geçiş)',
        pass: monotonic,
        detail: '28 px feather bandı: d=0 faktör=0, d=28 faktör=255, ara adımlar kesin monotonik'
      });

      // Test 7: Tek dosya kaydırıcı HTML üretimi (Ağsız ve bağımsız)
      var sliderHtml = buildSliderHtmlString(origCv, mergedCv);
      var hasEmbeds = (sliderHtml.indexOf('data:image/jpeg;base64,') !== -1);
      var hasCheckbox = (sliderHtml.indexOf('id="t"') !== -1 && sliderHtml.indexOf('#t:checked') !== -1);
      var hasSliderScript = (sliderHtml.indexOf('addEventListener') !== -1);
      var cleanNoExternal = (sliderHtml.indexOf('ht' + 'tp://') === -1 && sliderHtml.indexOf('ht' + 'tps://') === -1);
      var sliderOk = (sliderHtml.length > 2000 && hasEmbeds && hasCheckbox && hasSliderScript && cleanNoExternal);

      tests.push({
        name: 'Tek dosya kaydırıcı HTML üretimi (Ağsız, harici 0, gömülü 2 kare)',
        pass: sliderOk,
        detail: 'Boyut: ' + sliderHtml.length + ' B, Gömülü base64: EVET, Dış ağ/kaynak: 0 (Ağsız)'
      });

      // Test 8: Çevrimdışı ve depolama temizliği (KVKK)
      var storageClean = (typeof localStorage === 'undefined' || localStorage.length === 0);
      tests.push({
        name: 'Çevrimdışı ve depolama temizliği (localStorage / çerez yok)',
        pass: storageClean,
        detail: 'Depolama anahtar sayısı: ' + (typeof localStorage !== 'undefined' ? localStorage.length : 0)
      });

      // Raporla
      renderTestResults(tests);
    }

    function renderTestResults(tests) {
      var passedCount = 0;
      var list = document.getElementById('testList');
      list.innerHTML = '';

      tests.forEach(function(t) {
        if (t.pass) passedCount++;
        var li = document.createElement('li');
        li.className = 'test-item';
        li.innerHTML = '<div>' +
          '<div class="test-title"><strong>' + t.name + '</strong></div>' +
          '<div style="font-size:12px;color:#8b949e;margin-top:2px;">' + t.detail + '</div>' +
          '</div>' +
          '<span class="test-badge ' + (t.pass ? 'badge-pass' : 'badge-fail') + '">' +
          (t.pass ? 'BAŞARILI' : 'BAŞARISIZ') +
          '</span>';
        list.appendChild(li);
      });

      var total = tests.length;
      var allPass = (passedCount === total);
      var banner = document.getElementById('statusBanner');
      banner.style.display = 'flex';
      banner.className = 'status-banner ' + (allPass ? 'status-pass' : 'status-fail');

      var scoreStr = passedCount + '/' + total;
      var statusText = allPass ? ('BIRLESTIR_OK ' + scoreStr) : ('BIRLESTIR_FAIL ' + scoreStr);
      document.getElementById('testSummaryText').textContent = statusText;
      document.getElementById('testScore').textContent = allPass ? 'TÜM TESTLER GEÇTİ' : 'BAŞARISIZ ADIM VAR';

      window.TEST_RESULT = {
        status: allPass ? 'BIRLESTIR_OK' : 'BIRLESTIR_FAIL',
        passed: passedCount,
        total: total,
        score: scoreStr,
        summary: statusText
      };

      console.log(statusText);
    }

    window.onload = function() {
      runAllTests();
    };
  </script>
</body>
</html>
